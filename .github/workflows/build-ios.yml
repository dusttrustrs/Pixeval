name: Build iOS IPA

on:
  workflow_dispatch: # 支持手动一键触发

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive # Pixeval 包含 submodule，必须递归拉取
          filter: tree:0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install iOS Workload
        run: dotnet workload install ios

      - name: Build & Publish iOS (.app)
        run: |
          dotnet publish src/Pixeval.iOS/Pixeval.iOS.csproj \
            -c Release \
            -f net11.0-ios \
            -r ios-arm64 \
            -p:EnableCodeSigning=false \
            -p:_RequireCodeSigning=false \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -o build-output

      - name: Package to IPA (Unsigned)
        run: |
          APP_PATH=$(find build-output -maxdepth 3 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found in build-output"
            ls -la build-output
            exit 1
          fi
          echo "Found app bundle: $APP_PATH"
          rm -rf Payload Pixeval.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Pixeval.ipa Payload
          ls -lh Pixeval.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pixeval-iOS-IPA
          path: Pixeval.ipa
          if-no-files-found: error
